apiVersion: v1
kind: ConfigMap
metadata:
  name: emotionalbeach-config
  namespace: emotionalbeach
  labels:
    app.kubernetes.io/name: emotionalbeach
data:
  # 非敏感配置。敏感字段（密码 / JWT / OAuth secret）通过 Secret 以环境变量覆盖。
  # viper AutomaticEnv 会用 SERVER_JWTSECRET / DATABASES_POSTGRES_MAIN_PASSWORD 等环境变量覆盖同名键。
  config.yaml: |
    server:
      port: 8080
      clientID: "Ov23liHFDhW92VVXEQlZ"
      clientSecret: "REPLACED_BY_SECRET"
      jwtSecret: "REPLACED_BY_SECRET"
      enableRedis: false
      readTimeoutSec: 15
      writeTimeoutSec: 30
      idleTimeoutSec: 60
      shutdownTimeoutSec: 10

    log:
      level: "info"
      filename: ""            # 容器内只输出到 stdout，交给 k8s 日志收集
      maxSizeMB: 100
      maxBackups: 5
      maxAgeDays: 30
      compress: true

    databases:
      postgres_main:
        type: postgres
        host: emotionalbeach-postgres   # 指向集群内 postgres Service
        port: 5432
        user: postgres
        password: "REPLACED_BY_SECRET"
        dbname: hi_chat
        sslmode: disable
        max_open_conns: 20
        max_idle_conns: 10
        conn_max_lifetime: 300

    redis:
      host: emotionalbeach-redis
      port: 6379
      password: "REPLACED_BY_SECRET"
      db: 0
      pool_size: 20
      min_idle_connects: 5

    default_database: postgres_main

