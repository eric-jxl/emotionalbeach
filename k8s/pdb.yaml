apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: emotionalbeach
  namespace: emotionalbeach
  labels:
    app.kubernetes.io/name: emotionalbeach
spec:
  # 保证节点维护 / 自愈期间至少有 2 个副本可用，配合滚动更新保持服务可用
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: emotionalbeach
      app.kubernetes.io/component: api

