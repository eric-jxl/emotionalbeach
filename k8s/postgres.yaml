apiVersion: v1
kind: Service
metadata:
  name: emotionalbeach-postgres
  namespace: emotionalbeach
  labels:
    app.kubernetes.io/name: emotionalbeach
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emotionalbeach
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emotionalbeach-postgres
  namespace: emotionalbeach
  labels:
    app.kubernetes.io/name: emotionalbeach
    app.kubernetes.io/component: postgres
spec:
  serviceName: emotionalbeach-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emotionalbeach
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emotionalbeach
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: hi_chat
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: emotionalbeach-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

